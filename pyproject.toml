[project]
name = "reveille"
version = "0.1.0"
description = "highland village daily plaintext briefing"
requires-python = ">=3.14"
dependencies = [
    "feedparser>=6.0",
]

[tool.uv]
# Wait a week before resolving a newly published version. A package that
# is compromised upstream is usually caught within days, and nothing here
# needs a release the hour it lands.
exclude-newer = "7 days"
