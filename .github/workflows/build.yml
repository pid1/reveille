name: build dashboard

on:
  schedule:
    # These are a FALLBACK, not the primary trigger. GitHub defers this
    # repository's entire schedule queue by hours at a time -- the median
    # dispatch delay was ~5h over the first week of September 2026, and both
    # this workflow and keepalive.yml were deferred by the same ~7h50m on
    # 2026-08-31 despite firing on different minutes. Moving the cron off
    # the top of the hour did not help and could not have; see
    # docs/scheduling.md for the measurements.
    #
    # So instead of one dispatch that may land anywhere in the day, ask for
    # fifteen across a 4.5-hour window. Whichever one GitHub actually
    # delivers first wins; the gate job below turns every later attempt into
    # a no-op, so this still produces exactly one briefing per day.
    #
    # The window starts at 11:17 UTC rather than 09:17 deliberately. The
    # primary trigger fires at 09:17 UTC in CDT and 10:17 in CST, and a
    # Cloudflare build takes about a minute. Starting an hour after the later
    # of those means the gate is asking about a build that has either
    # finished or definitively failed, instead of racing one still in flight.
    - cron: "17,37,57 11-15 * * *"
  # The primary trigger is a Cloudflare Worker (infra/cloudflare/), which
  # POSTs a Workers Builds deploy hook at 04:17 central. That build renders
  # the page and deploys it without involving Actions at all. This event
  # remains for manual runs and for pushes.
  workflow_dispatch: # manual trigger via UI, `gh workflow run`, or the API
  push:
    branches: [main]

# Least privilege by default; each job grants only what it needs.
permissions: {}

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  # Decides whether this dispatch should produce a briefing. Runs before the
  # build so a skipped attempt costs ~10 seconds and no dependency install.
  #
  # Freshness is decided from Cloudflare's deployment record for the reveille
  # Worker. That record is written by whichever path deployed -- the
  # Cloudflare build or this workflow -- which is exactly what makes the two
  # paths deduplicate against each other without knowing about each other.
  # It is also not CDN-cached and cannot be confused by an unexpected
  # response body; see docs/scheduling.md for what went wrong when this gate
  # fetched the live page instead.
  gate:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.decide.outputs.build }}
    steps:
      - name: Decide whether to build
        id: decide
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WORKER_NAME: reveille
          TZ_NAME: ${{ secrets.HV_TIMEZONE }}
          # Local times, HHMM. Outside this window a dispatch is so late that
          # the briefing would carry the wrong day, and the next morning's
          # attempts are the better recovery path.
          WINDOW_OPEN: "0300"
          WINDOW_CLOSE: "2000"
        run: |
          set -euo pipefail

          decide() {
            echo "build=$1" >> "$GITHUB_OUTPUT"
            echo "$2"
            echo "$2" >> "$GITHUB_STEP_SUMMARY"
          }

          # push and workflow_dispatch are explicit requests; honour them.
          # Only the best-effort schedule event gets second-guessed.
          if [ "$GITHUB_EVENT_NAME" != "schedule" ]; then
            decide true "${GITHUB_EVENT_NAME}: explicit trigger, building."
            exit 0
          fi

          today=$(TZ="$TZ_NAME" date +%F)
          now=$((10#$(TZ="$TZ_NAME" date +%H%M)))

          if [ "$now" -lt "$((10#$WINDOW_OPEN))" ] || [ "$now" -gt "$((10#$WINDOW_CLOSE))" ]; then
            decide false "Dispatched outside the ${WINDOW_OPEN}-${WINDOW_CLOSE} local publish window. Skipping."
            exit 0
          fi

          # Errors are surfaced rather than discarded -- swallowing curl's
          # stderr is what made the original failure impossible to diagnose
          # from the job log.
          api() {
            curl -sS --fail-with-body --max-time 20 --retry 2 --retry-delay 5 \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "Content-Type: application/json" \
              "$1"
          }

          deployments_url="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${WORKER_NAME}/deployments"
          last_published=""

          if body=$(api "$deployments_url"); then
            # Newest wins regardless of the order the API returns them in.
            last_published=$(
              echo "$body" | jq -r '
                [ (.result.deployments? // .result? // [])[]?
                  | .created_on? // empty ]
                | sort | last // ""'
            )
          else
            echo "could not list deployments for ${WORKER_NAME} (see the error above)"
          fi

          if [ -z "$last_published" ]; then
            # Fails open on purpose: a briefing missed costs the morning, a
            # duplicate costs one extra push notification.
            decide true "No Cloudflare deployment found for ${WORKER_NAME}. Failing open and building."
            exit 0
          fi

          published_day=$(TZ="$TZ_NAME" date -d "$last_published" +%F)

          if [ "$published_day" = "$today" ]; then
            decide false "Page last published ${last_published} (${published_day} local). Today is ${today}; skipping duplicate build."
            exit 0
          fi

          decide true "Page last published ${published_day} local, today is ${today}. Building."

  # Build and deploy are one job: wrangler needs the dist/ the build just
  # produced, and handing it between jobs through an artifact bought nothing
  # once GitHub Pages stopped being the target.
  publish:
    needs: gate
    if: needs.gate.outputs.build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # This job only reads the tree; no need to persist the token.
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - name: Sync deps
        run: uv sync --frozen
      - name: Build site
        env:
          HV_LAT: ${{ secrets.HV_LAT }}
          HV_LON: ${{ secrets.HV_LON }}
          HV_ZIP: ${{ secrets.HV_ZIP }}
          HV_CITY: ${{ secrets.HV_CITY }}
          HV_STATE: ${{ secrets.HV_STATE }}
          HV_COUNTY: ${{ secrets.HV_COUNTY }}
          HV_TIMEZONE: ${{ secrets.HV_TIMEZONE }}
          HV_GHOSTMAPS_RADIUS_MILES: ${{ secrets.HV_GHOSTMAPS_RADIUS_MILES }}
          GRIDSTATUS_API_KEY: ${{ secrets.GRIDSTATUS_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PUSHOVER_API_KEY: ${{ secrets.PUSHOVER_API_KEY }}
          PUSHOVER_USER_KEY: ${{ secrets.PUSHOVER_USER_KEY }}
          # Optional. Only raises the anonymous rate limit on the GitHub API
          # call the ghostmaps fetcher makes against a third-party repo.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_SHA: ${{ github.sha }}
        run: uv run python build.py
      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy
