name: build dashboard

on:
  schedule:
    # These are a FALLBACK, not the primary trigger. GitHub defers this
    # repository's entire schedule queue by hours at a time -- the median
    # dispatch delay was ~5h over the first week of September 2026, and both
    # this workflow and keepalive.yml were deferred by the same ~7h50m on
    # 2026-08-31 despite firing on different minutes. Moving the cron off
    # the top of the hour did not help and could not have; see
    # docs/scheduling.md for the measurements.
    #
    # So instead of one dispatch that may land anywhere in the day, ask for
    # fifteen across a 4.5-hour window (09:17-13:57 UTC / 04:17-08:57 CDT).
    # Whichever one GitHub actually delivers first wins; the gate job below
    # turns every later attempt into a no-op, so this still produces exactly
    # one briefing per day.
    - cron: "17,37,57 9-13 * * *"
  # The primary trigger. A Cloudflare Worker (infra/cloudflare/) calls the
  # workflow_dispatch API at 04:17 central, which starts the workflow through
  # this event and bypasses GitHub's schedule queue entirely. It runs on
  # Cloudflare rather than local hardware so the briefing does not depend on
  # a box at the house staying up. scripts/trigger-build.sh does the same
  # from a shell.
  workflow_dispatch: # manual trigger via UI, `gh workflow run`, or the API
  push:
    branches: [main]

# Least privilege by default; each job grants only what it needs.
permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Decides whether this dispatch should produce a briefing. Runs before the
  # build so a skipped attempt costs ~10 seconds and no dependency install.
  #
  # Freshness is decided from the github-pages deployment record rather than
  # by fetching the live page: the deployment API is not CDN-cached, needs no
  # public reachability, and cannot be confused by an unexpected response
  # body. See docs/scheduling.md for what went wrong with the page fetch.
  gate:
    runs-on: ubuntu-latest
    permissions:
      # Read-only access to the github-pages deployment history, which is how
      # this job knows whether today's briefing already went out.
      deployments: read
    outputs:
      build: ${{ steps.decide.outputs.build }}
    steps:
      - name: Decide whether to build
        id: decide
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TZ_NAME: ${{ secrets.HV_TIMEZONE }}
          # Local times, HHMM. Outside this window a dispatch is so late that
          # the briefing would carry the wrong day, and the next morning's
          # attempts are the better recovery path.
          WINDOW_OPEN: "0300"
          WINDOW_CLOSE: "2000"
        run: |
          set -euo pipefail

          decide() {
            echo "build=$1" >> "$GITHUB_OUTPUT"
            echo "$2"
            echo "$2" >> "$GITHUB_STEP_SUMMARY"
          }

          # push and workflow_dispatch are explicit requests; honour them.
          # Only the best-effort schedule event gets second-guessed.
          if [ "$GITHUB_EVENT_NAME" != "schedule" ]; then
            decide true "${GITHUB_EVENT_NAME}: explicit trigger, building."
            exit 0
          fi

          today=$(TZ="$TZ_NAME" date +%F)
          now=$((10#$(TZ="$TZ_NAME" date +%H%M)))

          if [ "$now" -lt "$((10#$WINDOW_OPEN))" ] || [ "$now" -gt "$((10#$WINDOW_CLOSE))" ]; then
            decide false "Dispatched outside the ${WINDOW_OPEN}-${WINDOW_CLOSE} local publish window. Skipping."
            exit 0
          fi

          # The github-pages deployment record is the authority on when the
          # briefing last published. The first version of this gate fetched
          # the live page over HTTP instead, which was wrong twice over: the
          # page is served through a CDN that can hand back a stale copy, and
          # a fetch that returned nothing usable was indistinguishable from
          # "nothing published yet", so the gate failed open every morning and
          # every fallback cron produced a second briefing. The deployment API
          # is not cached, needs no public reachability, and does not depend on
          # the page's HTML shape.
          #
          # Errors are surfaced rather than discarded -- swallowing curl's
          # stderr is what made the original failure impossible to diagnose
          # from the job log.
          api() {
            curl -sS --fail-with-body --max-time 20 --retry 2 --retry-delay 5 \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$1"
          }

          deployments_url="${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/deployments?environment=github-pages&per_page=10"
          last_published=""

          if deployments=$(api "$deployments_url"); then
            # Newest first. Take the first one that actually reached success --
            # a created-but-failed deployment did not update the page.
            while read -r created statuses_url; do
              [ -n "$created" ] || continue
              state=$(api "${statuses_url}?per_page=1" | jq -r '.[0].state // ""') || state=""
              if [ "$state" = "success" ]; then
                last_published="$created"
                break
              fi
            done < <(echo "$deployments" | jq -r '.[] | "\(.created_at) \(.statuses_url)"')
          else
            echo "could not list github-pages deployments (see the error above)"
          fi

          if [ -z "$last_published" ]; then
            # Fails open on purpose: a briefing missed costs the morning, a
            # duplicate costs one extra push notification.
            decide true "No successful github-pages deployment found. Failing open and building."
            exit 0
          fi

          published_day=$(TZ="$TZ_NAME" date -d "$last_published" +%F)

          if [ "$published_day" = "$today" ]; then
            decide false "Page last published ${last_published} (${published_day} local). Today is ${today}; skipping duplicate build."
            exit 0
          fi

          decide true "Page last published ${published_day} local, today is ${today}. Building."

  build:
    needs: gate
    if: needs.gate.outputs.build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # This job only reads the tree; no need to persist the token.
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - name: Sync deps
        run: uv sync --frozen
      - name: Build site
        env:
          HV_LAT: ${{ secrets.HV_LAT }}
          HV_LON: ${{ secrets.HV_LON }}
          HV_ZIP: ${{ secrets.HV_ZIP }}
          HV_CITY: ${{ secrets.HV_CITY }}
          HV_STATE: ${{ secrets.HV_STATE }}
          HV_COUNTY: ${{ secrets.HV_COUNTY }}
          HV_TIMEZONE: ${{ secrets.HV_TIMEZONE }}
          HV_GHOSTMAPS_RADIUS_MILES: ${{ secrets.HV_GHOSTMAPS_RADIUS_MILES }}
          GRIDSTATUS_API_KEY: ${{ secrets.GRIDSTATUS_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PUSHOVER_API_KEY: ${{ secrets.PUSHOVER_API_KEY }}
          PUSHOVER_USER_KEY: ${{ secrets.PUSHOVER_USER_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_SHA: ${{ github.sha }}
        run: uv run python build.py
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
