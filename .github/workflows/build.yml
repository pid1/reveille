name: build dashboard

on:
  schedule:
    - cron: '17 9 * * *'   # daily at 09:17 UTC (~4am CDT / ~3am CST)
  workflow_dispatch:        # manual trigger via UI or `gh workflow run`
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
      - name: Sync deps
        run: uv sync --frozen
      - name: Build site
        env:
          HV_LAT: ${{ secrets.HV_LAT }}
          HV_LON: ${{ secrets.HV_LON }}
          HV_ZIP: ${{ secrets.HV_ZIP }}
          HV_CITY: ${{ secrets.HV_CITY }}
          HV_STATE: ${{ secrets.HV_STATE }}
          HV_COUNTY: ${{ secrets.HV_COUNTY }}
          HV_TIMEZONE: ${{ secrets.HV_TIMEZONE }}
          HV_GHOSTMAPS_RADIUS_MILES: ${{ secrets.HV_GHOSTMAPS_RADIUS_MILES }}
          GRIDSTATUS_API_KEY: ${{ secrets.GRIDSTATUS_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PUSHOVER_API_KEY: ${{ secrets.PUSHOVER_API_KEY }}
          PUSHOVER_USER_KEY: ${{ secrets.PUSHOVER_USER_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_SHA: ${{ github.sha }}
        run: uv run python build.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
