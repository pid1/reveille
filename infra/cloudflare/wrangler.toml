name = "reveille-trigger"
main = "worker.js"
compatibility_date = "2026-09-11"

# no public url: only the service binding from reveille-full can reach it.
# this has to sit above the first [table]; inside [triggers] wrangler
# ignores it and publishes a workers.dev url (it did, 2026-11-15).
workers_dev = false

# No crons of its own since 2026-11-15. The account's free plan allows five
# cron triggers and reveille-full needed one (Win's call: fold the morning
# trigger into it rather than pay for Workers Paid). reveille-full's
# 10-minute cron calls this worker's fetch() over a service binding on the
# run that falls between 04:20 and 04:29 central. The GitHub fallback in
# build.yml is unchanged.
[triggers]
crons = []

[vars]
TARGET_TZ = "America/Chicago"
TARGET_HOUR = "4"

# DEPLOY_HOOK_URL is a secret, not a var -- anyone holding it can start a
# build. Create the hook under the reveille Worker in the dashboard
# (Settings > Builds > Deploy Hooks), then:
#   wrangler secret put DEPLOY_HOOK_URL
# Optional, for an alert when every dispatch attempt fails:
#   wrangler secret put PUSHOVER_API_KEY
#   wrangler secret put PUSHOVER_USER_KEY
